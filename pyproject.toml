[project]
name = "satellite"
version = "0.1.0"
description = "Descriptive pilot: free satellite proxies versus Thai listed company quarterly results"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "rasterio", "pystac-client", "matplotlib", "scipy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"src/satellite/report.py" = ["E501"]
